appId: ${APP_ID}
tags:
  - cash
  - parallel
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      isE2ETest: true
- runFlow: ../../utils/Prepare.yaml
- runFlow: ../../utils/ImportWalletWithKey.yaml
- runFlow:
    file: ../../utils/SetExperimentalFlag.yaml
    env:
      FLAG: Cash
      VALUE: 'true'
- runFlow:
    file: ../../utils/SetCashAccount.yaml
    env:
      VALUE: 'true'
# An account holder reauthenticates before the sheet is shown. With no linked card,
# there is no Add From row and the action button opens Setup at the card step.
- tapOn:
    id: buy-button
- runFlow: ../../utils/ReauthenticateCash.yaml
- assertVisible:
    id: cash-deposit-add-cash-add-card
- assertNotVisible:
    id: cash-deposit-add-cash-add-from
- tapOn:
    id: cash-deposit-add-cash-add-card
- assertVisible:
    text: 'Enter card details'
