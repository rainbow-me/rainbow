appId: ${APP_ID}
tags:
  - cash
  - parallel
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      isE2ETest: true
- runFlow: ../../utils/Prepare.yaml
- runFlow: ../../utils/ImportWalletWithKey.yaml
- runFlow:
    file: ../../utils/SetExperimentalFlag.yaml
    env:
      FLAG: Cash
      VALUE: 'true'
- tapOn:
    id: buy-button
- assertVisible:
    text: 'Cash Deposits'
- assertVisible:
    id: cash-deposit-intro-set-up-account
- assertVisible:
    id: cash-deposit-intro-other-deposit-methods
- assertVisible:
    id: cash-deposit-intro-sign-in
- tapOn:
    id: cash-deposit-intro-set-up-account
- assertVisible:
    text: 'Connect your phone number'
- tapOn:
    id: cash-setup-phone-input
- inputText: '4155550100'
- tapOn:
    id: cash-setup-next
# The OTP input autofocuses; the mock verify accepts only 000000 and advances on fill.
- extendedWaitUntil:
    visible:
      text: 'Confirm your phone'
    timeout: 10000
- waitForAnimationToEnd
- inputText: '000000'
- extendedWaitUntil:
    visible:
      text: 'Enter some information about yourself'
    timeout: 10000
- tapOn:
    id: cash-setup-first-name-input
- inputText: 'Ada'
- tapOn:
    id: cash-setup-last-name-input
- inputText: 'Lovelace'
- tapOn:
    id: cash-setup-dob-input
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: cash-setup-dob-picker
      - tapOn:
          id: cash-setup-dob-picker-confirm
- runFlow:
    when:
      platform: Android
    commands:
      # RN testID is not applied to the native dialog on Android (Detox-only), so target the platform ids
      - assertVisible:
          id: android:id/datePicker
      - tapOn:
          id: android:id/button1
- tapOn:
    id: cash-setup-next
- assertVisible:
    text: 'Enter the last 4 digits of your SSN'
- tapOn:
    id: cash-setup-ssn-input
- inputText: '6789'
- tapOn:
    id: cash-setup-next
- assertVisible:
    text: 'Review your information'
- assertVisible:
    text: 'Ada Lovelace'
# Confirm submits KYC; the mock approves after ~1s, then the repeat loop walks the placeholder steps.
- tapOn:
    id: cash-setup-next
- extendedWaitUntil:
    visible:
      text: 'Add a Passkey'
    timeout: 10000
# Add Passkey runs the mock enrollment (~3s of mocked RPC + ceremony delays) before advancing.
- tapOn:
    id: cash-setup-next
- extendedWaitUntil:
    visible:
      text: 'Enter email'
    timeout: 10000
- repeat:
    while:
      notVisible:
        id: cash-setup-success-action
    commands:
      - tapOn:
          id: cash-setup-next
      - waitForAnimationToEnd
- tapOn:
    id: cash-setup-success-action
- assertVisible:
    text: 'Enter card details'
- tapOn: 'Card number'
- inputText: '4242424242424242'
- tapOn: 'MM / YY'
- inputText: '1234'
- tapOn: 'CVC'
- inputText: '123'
- tapOn: 'ZIP code'
- inputText: '12345'
- pressKey: Enter
- tapOn:
    id: cash-setup-next
- assertVisible:
    text: 'Card added'
- tapOn:
    id: cash-setup-success-action
- assertVisible:
    id: cash-deposit-add-cash-add-from
