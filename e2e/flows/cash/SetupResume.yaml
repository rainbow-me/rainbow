appId: ${APP_ID}
tags:
  - cash
  - parallel
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      isE2ETest: true
- runFlow: ../../utils/Prepare.yaml
- runFlow: ../../utils/ImportWalletWithKey.yaml
- runFlow:
    file: ../../utils/SetExperimentalFlag.yaml
    env:
      FLAG: Cash
      VALUE: 'true'
- tapOn:
    id: buy-button
- assertVisible:
    id: cash-deposit-intro-set-up-account
- tapOn:
    id: cash-deposit-intro-set-up-account
- assertVisible:
    text: 'Connect your phone number'
# A phone registered with a passkey (mock 1303) dead-ends with the already-registered message.
- tapOn:
    id: cash-setup-phone-input
- inputText: '5'
- inputText: '5'
- inputText: '5'
- inputText: '0'
- inputText: '0'
- inputText: '0'
- inputText: '1'
- inputText: '3'
- inputText: '0'
- inputText: '3'
- tapOn:
    id: cash-setup-next
- extendedWaitUntil:
    visible:
      text: 'This number is already connected to an account.'
    timeout: 10000
- tapOn:
    id: cash-setup-phone-input
- eraseText
# Erasing the reformatting input can strand the cursor mid-string and leave digits behind,
# which then scrambles the retyped number. Re-tap to move the cursor to the end and erase
# again until the field is empty, then verify the retyped number before submitting.
- repeat:
    times: 3
    while:
      visible:
        text: '\(.*'
    commands:
      - tapOn:
          id: cash-setup-phone-input
      - eraseText
      - waitForAnimationToEnd
- inputText: '5'
- inputText: '5'
- inputText: '5'
- inputText: '0'
- inputText: '0'
- inputText: '0'
- inputText: '1'
- inputText: '3'
- inputText: '0'
- inputText: '4'
- assertVisible:
    text: '\(555\) 000-1304'
- assertNotVisible:
    text: 'This number is already connected to an account.'
# A phone registered without a passkey (mock 1304) silently resumes into the same OTP screen.
- tapOn:
    id: cash-setup-next
- extendedWaitUntil:
    visible:
      text: 'Confirm your phone'
    timeout: 10000
- waitForAnimationToEnd
# The 1322 guardrail (mock code 001322) pops back to the phone step with the message.
- inputText: '0'
- inputText: '0'
- inputText: '1'
- inputText: '3'
- inputText: '2'
- inputText: '2'
- extendedWaitUntil:
    visible:
      text: 'Connect your phone number'
    timeout: 10000
- assertVisible:
    text: 'This number is already connected to an account.'
# The kept digits resume again; the mock OTP finishes the resume, and the mock
# account's approved KYC (mock GetUserStatus) is acknowledged before Add Passkey.
- tapOn:
    id: cash-setup-next
- extendedWaitUntil:
    visible:
      text: 'Confirm your phone'
    timeout: 10000
- waitForAnimationToEnd
- inputText: '0'
- inputText: '0'
- inputText: '0'
- inputText: '0'
- inputText: '0'
- inputText: '0'
- extendedWaitUntil:
    visible:
      text: 'Identity verified'
    timeout: 10000
- tapOn:
    id: cash-setup-kyc-success-continue
- extendedWaitUntil:
    visible:
      text: 'Add a Passkey'
    timeout: 10000
# The step text stays in the hierarchy underneath a sheet, so assert the sheet itself is gone.
- assertNotVisible:
    id: cash-setup-kyc-success-overlay
