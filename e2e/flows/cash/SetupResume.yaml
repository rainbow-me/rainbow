appId: ${APP_ID}
tags:
  - cash
  - parallel
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      isE2ETest: true
- runFlow: ../../utils/Prepare.yaml
- runFlow: ../../utils/ImportWalletWithKey.yaml
- runFlow:
    file: ../../utils/SetExperimentalFlag.yaml
    env:
      FLAG: Cash
      VALUE: 'true'
- tapOn:
    id: buy-button
- assertVisible:
    id: cash-deposit-intro-set-up-account
- tapOn:
    id: cash-deposit-intro-set-up-account
- assertVisible:
    text: 'Connect your phone number'
- inputText: '5'
- inputText: '5'
- inputText: '5'
- inputText: '0'
- inputText: '0'
- inputText: '0'
- inputText: '1'
- inputText: '3'
- inputText: '0'
- inputText: '4'
- assertVisible:
    text: '\(555\) 000-1304'
- assertNotVisible:
    text: 'This number is already connected to an account.'
# A phone registered without a passkey (mock 1304) silently resumes into the same OTP screen.
- tapOn:
    id: cash-setup-next
- extendedWaitUntil:
    visible:
      text: 'Confirm your phone'
    timeout: 10000
- waitForAnimationToEnd
# The mock OTP finishes the resume, and the mock account's approved KYC is
# acknowledged before Add Passkey.
- inputText: '0'
- inputText: '0'
- inputText: '0'
- inputText: '0'
- inputText: '0'
- inputText: '0'
- extendedWaitUntil:
    visible:
      text: 'Identity verified'
    timeout: 10000
- tapOn:
    id: cash-setup-kyc-success-continue
- extendedWaitUntil:
    visible:
      text: 'Add a Passkey'
    timeout: 10000
# The step text stays in the hierarchy underneath a sheet, so assert the sheet itself is gone.
- assertNotVisible:
    id: cash-setup-kyc-success-overlay
