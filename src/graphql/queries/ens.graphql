query getDomainsByAddress($address: ID!) {
  account(id: $address) {
    domains(orderBy: createdAt, orderDirection: desc) {
      name
    }
    registrations(orderBy: registrationDate, orderDirection: desc) {
      domain {
        name
        owner {
          id
        }
      }
    }
  }
}

query getResolverKeys($resolver: Bytes!, $node: String!) {
  resolvers(first: 1, where: { address: $resolver, domain: $node }) {
    texts
    coinTypes
  }
}

query getRegistration($id: ID!) {
  registration(id: $id) {
    registrationDate
  }
}

query getV2Registration($registry: String!, $labelhash: Bytes!) {
  ensv2NameSlots(first: 1, where: { registry: $registry, labelhash: $labelhash }) {
    migratedFromV1
    currentResource {
      createdAt
    }
  }
}
