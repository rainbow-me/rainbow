version: 1
reviews:
  custom_instructions: |
    Severity
    - Report P0/P1 only with a concrete, reachable trigger in this repo: name the call path and the state that produces the failure. If the claim depends on backend behavior or on code outside this repository, post it as a question at P2 or lower, not as a bug.
    - Before reporting a race, stale async completion or teardown bug, confirm the interleaving can happen: check whether the UI can trigger it (disabled controls, covering sheets, screens that can't be dismissed) and whether the state survives an app restart. Don't report states that types or callers already rule out, and don't propose defensive guards for them.

    Scope
    - Flag only what the PR introduces, worsens or newly exposes. Don't ask a PR to handle a service, flow or case its linked ticket excludes, to add follow-up features (reconciliation, new copy, rerouted CTAs), or to fix pre-existing code it touches.

    Repository conventions (don't flag these)
    - Feature PRs add strings to src/languages/en_US.json only. Other locales come from Crowdin syncs, and i18n falls back to English.
    - The repo has no component render-test harness, so don't request render tests for screens or components.
    - NATIVE_ROUTES (src/navigation/routesNames.ts) is opt-in; a new sheet route doesn't need to be added to it.
    - @storesjs/stores catches errors in persisted-state hydration and migrate, and keeps the initial state. Don't request extra guards in migrate functions.

    Low-value comments
    - Don't comment on test names, comment wording or duplicate it.each titles, unless a name misstates what the test proves.
  auto_approve_behavior: live
  auto_approve: custom
  auto_approve_custom_prompt: |
    Decide whether this PR can be approved without a human. Approve by default. Require human review only when the diff does something in the High list below, or when you cannot verify a claim that decides whether it does.

    Assume every change can reach users tomorrow. Feature flags don't lower the bar.

    Ground every conclusion in the diff. Treat the PR title and description as the author's claims and check them against the diff. A product decision recorded in the linked ticket's description or comments counts as evidence for that product question, but not for engineering risk. If relevant diffs are truncated or omitted and you can't rule out a High item, require human review and say what you couldn't check. If any part of the PR is High, the whole PR is.

    High (needs a human):

    Wallet and money
    - Key material: seed phrases, private keys, backups, cloud backup, keychain or secure-storage access
    - Building, signing, simulating or broadcasting transactions or messages; nonce handling; swap and bridge SDKs
    - Gas, fee, slippage, amount or price-impact calculations; the amounts, addresses or recipients shown on confirmation and signing screens; token approvals and allowances
    - WalletConnect, dapp browser provider injection, deep links and universal links
    - Money-movement and identity flows (such as Cash): authentication, passkeys, sessions and tokens, order submission, KYC, and compliance or eligibility decisions

    Security and data
    - Authentication or authorization anywhere; secrets, API keys, environment config
    - Sending user data (addresses, balances, identifiers, device info) to a new party or endpoint; analytics SDK changes; new analytics events that carry user-identifying data
    - Adding any new dependency; upgrading a native dependency

    Platform and hard to reverse
    - Native code: ios/, android/, and patches that change native code; permissions, entitlements, Info.plist, AndroidManifest. Routine version-number bumps are exempt.
    - Persisted-state migrations: store version or migrate changes, renamed or removed storage keys
    - Build, CI, release and code-signing config (babel and metro config, .github/workflows, bitrise, fastlane, signing), and review or approval config (cubic.yaml)

    Everything else is approvable, including new features, new screens, new stores and network calls to existing backends, changed calculations outside the list above, removed features, refactors, performance work, and JS-only upgrades of existing dependencies. Touching business logic, size, or the theoretical chance of a bug are not reasons to decline; Cubic has already reviewed the implementation.

    When you require human review, name the High item and the file where the diff hits it. A generic reason doesn't count.
  auto_approve_rules:
    exclude_external_contributors: true
    # Bots aren't org members either: dependabot, renovate and app-authored PRs
    exclude_authors:
      - '*[bot]'
    # Any changed file matching one of these blocks auto-approval, whatever the prompt decides
    exclude:
      # Native, platform and patched dependencies
      - 'ios/**'
      - 'android/**'
      - 'patches/**'
      - 'app.json'
      - 'app.config.ts'
      - 'react-native.config.js'
      - 'rock.config.mjs'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.xcode-version'
      - '.ruby-version'
      - 'index.js'
      - 'shim.js'
      - 'InjectedJSBundle.js'
      # Build, CI, release, supply chain
      - '.github/**'
      - 'bitrise.yml'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'audit-ci.jsonc'
      - '.yarnrc.yml'
      - '.yarn/**'
      # Review config and the instructions reviewers read
      - 'cubic.yaml'
      - 'AGENTS.md'
      # Secrets and environment
      - '.env*'
      - 'src/env.ts'
      - 'globals.d.ts'
      # Keys, backups, local auth
      - 'src/model/wallet.ts'
      - 'src/helpers/signingWallet.ts'
      - 'src/utils/signingUtils.ts'
      - 'src/features/wallet/**'
      - 'src/features/local-auth/**'
      - 'src/features/backup/**'
      - 'src/handlers/cloudBackup.ts'
      - 'src/handlers/aesEncryption.ts'
      - 'src/components/secret-display/**'
      - 'src/features/hardware-wallet/**'
      # Building, signing and sending transactions
      - 'src/raps/**'
      - 'src/features/ens/raps/**'
      - 'src/systems/funding/execution/**'
      - 'src/helpers/buildTransaction.ts'
      - 'src/handlers/web3.ts'
      - 'src/handlers/swap.ts'
      - 'src/resources/transactions/transactionSimulation.ts'
      - 'src/features/gas/**'
      - 'src/features/transfer/**'
      - 'src/features/delegation/**'
      - 'src/screens/SpeedUpAndCancelSheet.tsx'
      - 'src/screens/claimables/transaction/**'
      - 'src/features/perps/services/**'
      - 'src/features/polymarket/utils/loadViemWallet.ts'
      - 'src/features/polymarket/stores/derived/usePolymarketClients.ts'
      - 'src/features/polymarket/utils/executePolymarketOrder.ts'
      - 'src/features/polymarket/utils/relayExecution.ts'
      - 'src/features/polymarket/utils/tradingApprovals.ts'
      - 'src/features/polymarket/utils/erc20Approval.ts'
      - 'src/features/polymarket/utils/collateral.ts'
      - 'src/features/polymarket/utils/collectPolymarketTradeFee.ts'
      - 'src/features/polymarket/utils/redeemPosition.ts'
      - 'src/features/rnbw-staking/utils/**'
      - 'src/features/rnbw-rewards/utils/**'
      - 'src/features/*/depositConfig.ts'
      - 'src/features/*/withdrawalConfig.ts'
      # dapp signing requests, injected provider, WalletConnect, deep links
      - 'src/features/dapp-request/**'
      - 'src/features/dapp-browser/services/**'
      - 'src/browser/**'
      - 'src/features/wallet-connect/**'
      - 'src/handlers/deeplinks.ts'
      # Cash: auth, passkeys, sessions, orders, KYC
      - 'src/features/cash/services/**'
      - 'src/features/cash/stores/**'
      - 'src/features/cash/screens/cash-deposit-setup/steps/useAddPasskeyFlow.ts'
      - 'src/features/cash/screens/cash-deposit-setup/steps/useSubmitReviewFlow.ts'
      # Persisted-state migrations and storage
      - 'src/migrations/**'
      - 'src/model/migrations.ts'
      - 'src/model/mmkv.ts'
      - 'src/storage/**'
      - 'src/handlers/localstorage/common.ts'
      - 'src/handlers/localstorage/migrations.ts'
      - 'src/handlers/localstorage/mmkvStorageBackend.ts'
      - 'src/state/internal/rainbowStorage.ts'
      - 'src/state/internal/persistStorage.ts'
      - 'src/state/internal/migrations/**'
      # Analytics SDK and user-identifying properties; event.ts stays approvable
      - 'src/analytics/index.ts'
      - 'src/analytics/appsflyer.ts'
      - 'src/analytics/userProperties.ts'
      - 'src/analytics/getWalletContext.ts'
      - 'src/analytics/utils.ts'
